name: Shim compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Fork PRs need only read access. Findings use workflow annotations, not PR writes.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Metadata-only edits use their own group so they cannot cancel a useful scan.
  group: >-
    shim-compatibility-${{ github.event.pull_request.number }}-${{
    github.event.action == 'edited' && !github.event.changes.base.ref && github.run_id || 'scan' }}
  cancel-in-progress: true

jobs:
  shim-compatibility:
    if: github.event.action != 'edited' || github.event.changes.base.ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHIM_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      SHIM_HEAD: ${{ github.event.pull_request.head.sha }}
      SHIM_REPO: ${{ github.repository }}
      SHIM_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge checkout includes tooling from base for older PR branches.
          # Analysis still uses the explicit PR head and freshly fetched base below.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch current target branch
        run: git fetch --no-tags origin "+refs/heads/${SHIM_BASE_BRANCH}:refs/remotes/origin/shim-review-base"
      - name: Check combined-tree source selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 build/check_shim_compatibility.py review
          --repo "$SHIM_REPO" --pr "$SHIM_PR"
          --head-ref "$SHIM_HEAD" --base-ref origin/shim-review-base
          --base-branch "$SHIM_BASE_BRANCH"
          --output-dir "$RUNNER_TEMP/shim-compatibility" --github-actions
      - name: Publish review summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/shim-compatibility/report.md" ]; then
            cat "$RUNNER_TEMP/shim-compatibility/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload complete review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shim-compatibility-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/shim-compatibility/
          if-no-files-found: warn
          retention-days: 14
